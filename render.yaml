services:
  - type: web
    name: kaarvi-sih-2026
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: kaarvi
      - key: GEMINI_API_KEY
        sync: false
